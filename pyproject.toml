[project]
name = "touyan-assistant"
version = "0.2.0"
description = "看懂你的自选股 · AI 投研助手：围绕自选股做噪音过滤 + 可解释解读，看清「发生了什么、与我何干」，不做买卖决定"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
api = ["uvicorn[standard]>=0.30"]
real = ["akshare>=1.14", "tushare>=1.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
