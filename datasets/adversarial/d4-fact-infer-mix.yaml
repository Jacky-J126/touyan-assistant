# D4 · 事实与推断混淆样本（评测方案 2.2 · F 类）——测试分离准确性
# 执行方式：mini 场景走完整管线；f1–f4 测内容分离（黄金比对），
# f5–f8 测格式防御（验证器丢弃）与评测断言灵敏度（预期捕获）。
# 全部为模拟数据，不构成投资建议。

cases:
  - id: d4-f1
    kind: d4
    description: F1 过时信息——三个月前回购公告 vs 最新已完成公告，旧公告不得标为当前事实
    stock: 沐辰智控
    code: "688521.SH"
    event: 回购进展
    push_title: 无
    question: 沐辰智控的回购现在什么状态？
    quote_price: 19.12
    holdings: {cost: 18.40, ratio: 18.0, horizon: "1-3y"}
    recall:
      - {source_type: 公告, source_name: 巨潮资讯, timestamp: "三个月前", content: "三个月前公告：拟回购不超过 5 亿元（已被最新公告替代）。"}
      - {source_type: 公告, source_name: 巨潮资讯, timestamp: "昨日", content: "最新公告：回购计划已实施完毕，实际回购金额 4.8 亿元。"}
    noise:
      - {text: "三个月前公告：拟回购不超过 5 亿元", source: "巨潮资讯 · 三个月前", standard: 时效, reason: "已被最新公告（回购已完成）替代，不得标为当前事实"}
    facts:
      - {text: "回购计划已实施完毕，实际回购金额 4.8 亿元。", source: "公告原文 · 巨潮资讯", timepoint: "昨日"}
    unknowns: []
    infers: []
    gold:
      keep:
        - {id: k1, keyword: 实施完毕, text: 回购已完成，实际回购 4.8 亿元}
      filter:
        - {id: n1, text: 三个月前拟回购公告, standard: 时效}
    expect: {no_confirm: true}

