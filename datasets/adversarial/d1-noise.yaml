  - id: d1-n4
    kind: d1
    description: N4 社媒可交叉验证——股吧帖准确引用公告原文，保留事实部分、解读部分过滤
    stock: 沐辰智控
    code: "688521.SH"
    event: 重大资产重组公告
    push_title: 沐辰智控发布重大公告：拟收购海外半导体设备资产
    question: 股吧里说的收购怎么回事？
    quote_price: 19.12
    holdings: {cost: 18.40, ratio: 18.0, horizon: "1-3y"}
    recall:
      - {source_type: 公告, source_name: 巨潮资讯, timestamp: "00:47", content: "沐辰智控拟收购 NovoSem Pte. Ltd. 100% 股权，交易对价约 2.1 亿美元（约合人民币 15.2 亿元），构成重大资产重组，尚需股东大会及境内外监管审批。以上公告内容为演示用模拟数据。"}
      - {source_type: 股吧, source_name: 股吧 / 社区讨论, timestamp: "02:10", content: "股吧帖准确引用公告原文并附个人解读「新业务很性感，未来不可限量」。", status: partial}
    noise:
      - {text: "「新业务很性感，未来不可限量」", source: "股吧回帖 · 02:10", standard: 信源, reason: "个人解读无信源；其引用的事实部分与公告交叉验证一致，已按例外条款保留在事实层"}
    facts:
      - {text: "沐辰智控拟收购 NovoSem 100% 股权，对价约 2.1 亿美元（约合人民币 15.2 亿元），构成重大资产重组。", source: "公告原文 · 巨潮资讯", timepoint: "00:47"}
    unknowns:
      - {text: "现金 / 股份支付比例尚未披露。", action: 需你补充}
    infers: []
    gold:
      keep:
        - {id: k1, keyword: NovoSem, text: 收购 NovoSem 100% 股权与对价}
      filter:
        - {id: n1, text: 未来不可限量解读, standard: 信源}
    expect: {no_confirm: true}

