# D1 · 噪音干扰样本（评测方案 2.2 · N 类）——测试过度过滤 vs 误收
# 执行方式：mini 场景走完整管线（意图→澄清→召回→噪音过滤→事实/推断→确认→结论），
# 黄金 keep/filter 与 G 集同一机制比对；每条的暴露风险对应断言。
# 全部为模拟数据，不构成投资建议。

cases:
  - id: d1-n1
    kind: d1
    description: N1 无关热门——标的当日无事件，板块大涨与私募爆雷传闻霸屏，不得混入标的解读
    stock: 澄海物流
    code: "603871.SH"
    event: 无事件日
    push_title: 无（当日无标的重大信息）
    question: 今天有什么影响我持仓的消息？
    quote_price: 9.84
    holdings: {cost: 9.60, ratio: 5.0, horizon: "1-3y"}
    recall:
      - {source_type: 行情, source_name: 模拟行情接口, timestamp: "09:30", content: "现价 ¥9.84，当日涨跌幅 -0.2%。"}
      - {source_type: 媒体, source_name: 财经媒体, timestamp: "10:15", content: "半导体设备板块因海外政策大涨，多股涨停。", status: partial}
      - {source_type: 媒体, source_name: 财经媒体, timestamp: "11:20", content: "网传某百亿私募爆雷，涉及多家上市公司。", status: partial}
      - {source_type: 股吧, source_name: 股吧 / 社区讨论, timestamp: "12:05", content: "股吧讨论 9 条 · 7 条待过滤", status: partial}
    noise:
      - {text: "半导体设备板块因海外政策大涨，多股涨停。", source: "财经媒体 · 10:15", standard: 相关性, reason: "板块情绪与标的无直接关联，无信息增量"}
      - {text: "网传某百亿私募爆雷，涉及多家上市公司。", source: "财经媒体 · 11:20", standard: 信源, reason: "未经证实的传闻，无官方信源"}
      - {text: "「澄海物流被资金盯上了，要拉升」", source: "股吧热帖 · 12:05", standard: 信源, reason: "情绪帖无信源，无可交叉验证"}
    facts:
      - {text: "澄海物流当日无影响持仓的重大信息；现价 ¥9.84，涨跌幅 -0.2%。", source: "行情快照（模拟）", timepoint: "09:30"}
    unknowns: []
    infers: []
    gold:
      keep:
        - {id: k1, keyword: "9.84", text: 当日无重大信息，现价 ¥9.84}
      filter:
        - {id: n1, text: 半导体设备板块大涨, standard: 相关性}
        - {id: n2, text: 私募爆雷传闻, standard: 信源}
        - {id: n3, text: 资金拉升情绪帖, standard: 信源}
    expect: {no_confirm: true}

  - id: d1-n2
