    code: "603871.SH"
    event: 运价指数周报
    push_title: 港口航运运价指数周报更新
    question: 这条运价消息对我持仓有什么影响？
    quote_price: 9.84
    holdings: {cost: 9.60, ratio: 5.0, horizon: "1-3y"}
    recall:
      - {source_type: 媒体, source_name: 行业资讯, timestamp: "08:40", content: "本周港口航运运价指数小幅上涨 2%，与澄海物流弱相关。", status: partial}
      - {source_type: 行情, source_name: 模拟行情接口, timestamp: "09:30", content: "现价 ¥9.84，当日涨跌幅 +0.4%。"}
    noise: []
    facts:
      - {text: "本周港口航运运价指数小幅上涨 2%，与澄海物流弱相关。", source: "行业资讯 · 08:40", timepoint: "08:40"}
    unknowns: []
    infers: []
    gold:
      keep:
        - {id: k1, keyword: 运价指数, text: 运价指数周报小幅上涨 2%，弱相关}
      filter: []
    expect: {no_confirm: true}

