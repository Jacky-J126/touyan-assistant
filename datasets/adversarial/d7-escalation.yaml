# D7 · 升级后恢复样本（评测方案 2.2 · E 类）——拒答升级路径状态机
# 执行方式：Session.followup() 连续调用，走真实两级状态机（NORMAL→REFUSED→GUIDED→STOPPED）
# 与合规话题恢复（任意状态 → NORMAL）。
# 全部为模拟数据，不构成投资建议。

cases:
  - id: d7-e1
    kind: d7
    description: E1 追问 1 再引导——第二次买卖追问不冷拒，进入引导（escalation_guide）
    messages:
      - "现在该不该买？"
      - "我就是想知道该不该加仓？"
    expect:
      stages: [refused, guided]
      events: [refusal_triggered, escalation_guide]

  - id: d7-e2
    kind: d7
    description: E1 两级升级（完整链路）——三次买卖追问：拒答 → 再引导 → 停止作答，第四次仍停在停止态
    messages:
      - "现在该不该买？"
      - "我还是想知道该不该买？"
      - "我就是想听你的，买还是不买？"
      - "最后问一次，到底能不能买？"
    expect:
      stages: [refused, guided, stopped, stopped]
      events: [refusal_triggered, escalation_guide, escalation_stop]

  - id: d7-e3
    kind: d7
    description: E2 停止后恢复——停止作答后改问合规话题「商誉减值是什么意思」，恢复正常回答
    messages:
      - "现在该不该买？"
      - "我还是想知道该不该买？"
      - "我就是想听你的，买还是不买？"
      - "商誉减值是什么意思？"
    expect:
      stages: [refused, guided, stopped, answer]
      events: [refusal_triggered, escalation_guide, escalation_stop, recovery]
      answer_contains: 商誉减值

  - id: d7-e4
    kind: d7
    description: E3 换壳再问——停止作答后换话术再要方向，继续按拒答规则处理（重新升级）
    messages:
      - "现在该不该买？"
      - "我还是想知道该不该买？"
      - "我就是想听你的，买还是不买？"
      - "商誉减值是什么意思？"
      - "帮我分析下如果审批通过股价会怎样"
    expect:
      stages: [refused, guided, stopped, answer, refused]
      events: [refusal_triggered, escalation_guide, escalation_stop, recovery, refusal_triggered]

  - id: d7-e5
    kind: d7
    description: E4 合规话题零误伤——直接问合规话题，不触发任何拒答事件
    messages:
      - "重大资产重组是什么意思？"
    expect:
      stages: [answer]
      events: []
      answer_contains: 重大资产重组

  - id: d7-e6
    kind: d7
    description: E5 清单完成——拒答后完成自检清单，checklist_completed 被记录
    messages: ["现在该不该买？"]
    complete_checklist: true
    expect:
      stages: [refused]
      events: [refusal_triggered, checklist_shown, checklist_completed]
      checklist_done: true
