name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（不含真实数据源：akshare/tushare 为可选 [real]）
        run: pip install -e ".[dev]"

      - name: 静态检查
        run: ruff check .

      - name: 单元与集成测试（红线断言 + 状态机 + API 全链路）
        run: pytest tests/ -q

      - name: 离线评测元测试（数据集 → mock 管线 → 断言 → 报告，红线全过）
        run: python -m evals.runner

      - name: 上传评测报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/latest-report.md
